<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Tessellating Shape Automaton</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        color: #e6edf3;
        font: 13px/1.45 system-ui, sans-serif;
      }
      #shell {
        display: flex;
        height: 100%;
      }
      #view {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }
      #app {
        display: block;
        width: 100%;
        height: 100%;
      }
      #view-hud {
        position: absolute;
        top: 10px;
        left: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #view-info {
        opacity: 0.75;
      }
      button {
        background: #17202b;
        color: inherit;
        border: 1px solid #2e3b4a;
        border-radius: 6px;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #1f2b39;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.active {
        background: #20404f;
        border-color: #3f7f9f;
      }
      #view-hud a {
        background: #17202b;
        color: inherit;
        border: 1px solid #2e3b4a;
        border-radius: 6px;
        padding: 5px 10px;
        text-decoration: none;
      }
      #view-hud a:hover {
        background: #1f2b39;
      }
      aside#lab {
        width: 340px;
        flex: 0 0 340px;
        border-left: 1px solid #1c2530;
        padding: 12px;
        overflow-y: auto;
      }
      aside#lab[hidden] {
        display: none;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 12px;
        margin: 16px 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.65;
      }
      p.hint {
        margin: 0 0 10px;
        opacity: 0.65;
      }
      #draw-grid {
        display: block;
        margin: 0 auto 10px;
        background: #0a0f16;
        border: 1px solid #223;
        border-radius: 8px;
        cursor: crosshair;
        touch-action: none;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row + .row {
        margin-top: 8px;
      }
      #lab-status {
        opacity: 0.8;
      }
      .results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 8px;
      }
      .result {
        padding: 4px;
        border: 1px solid #223;
        border-radius: 8px;
        background: #0a0f16;
        text-align: center;
        cursor: pointer;
      }
      .result.selected {
        border-color: #4a9;
        box-shadow: 0 0 0 1px #4a9;
      }
      .result canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        image-rendering: pixelated;
      }
      .result span {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        opacity: 0.75;
      }
      .collection {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .collection .item {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 5px 8px;
        background: #0a0f16;
        border: 1px solid #223;
        border-radius: 6px;
      }
      .collection .name {
        flex: 1 1 auto;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .empty {
        opacity: 0.5;
        font-style: italic;
      }
      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: 60ch;
        color: #f88;
      }
      #status:empty {
        display: none;
      }
      aside#prog {
        width: 330px;
        flex: 0 0 330px;
        border-left: 1px solid #1c2530;
        padding: 12px;
        overflow-y: auto;
      }
      aside#prog[hidden] {
        display: none;
      }
      .prog-level {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 10px 0;
      }
      .prog-shape {
        background: #0a0f16;
        border: 1px solid #223;
        border-radius: 8px;
      }
      .muted {
        opacity: 0.6;
        font-size: 12px;
      }
      .prog-message {
        min-height: 18px;
        color: #7fe0c0;
        font-size: 12px;
        margin: 8px 0;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .prog-message.show {
        opacity: 1;
      }
      .prog-gallery h2 {
        margin-top: 12px;
      }
      .prog-slots {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .prog-slot {
        width: 54px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed #2e3b4a;
        border-radius: 8px;
        background: #0a0f16;
        color: #556;
        font-size: 18px;
      }
      .prog-slot.found {
        border-style: solid;
        border-color: #2b6;
      }
      .prog-slot canvas {
        display: block;
        width: 52px;
        height: 52px;
        image-rendering: pixelated;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="view">
        <canvas id="app"></canvas>
        <div id="view-hud">
          <button id="mode-lab" class="active">Lab</button>
          <button id="mode-play">Play</button>
          <button id="mode-battle">Battle</button>
          <button id="mode-view">View</button>
          <button id="view-borders" title="Outline each tile">Borders</button>
          <button id="view-symmetry" title="Colour player tiles by symmetry">Symmetry</button>
          <a href="/learn.html" title="Interactive guide to the maths">Guide</a>
          <a href="/encyclopedia.html" title="Catalogue of polyominoes and their groups">Encyclopedia</a>
          <span id="view-info"></span>
        </div>
      </div>
      <aside id="lab">
        <h1>Lab</h1>
        <p class="hint">Draw a tile. The Lab searches for the tessellations it makes.</p>
        <canvas id="draw-grid" width="280" height="280"></canvas>
        <div id="lab-shape-info" class="hint"></div>
        <div class="row">
          <button id="lab-clear">Clear</button>
          <button id="lab-find">Find tilings</button>
          <span id="lab-status"></span>
        </div>
        <h2>Found</h2>
        <div id="lab-results" class="results"><span class="empty">None yet.</span></div>
        <div class="row">
          <button id="lab-save" disabled>Save to collection</button>
        </div>
        <h2>Collection</h2>
        <div id="lab-collection" class="collection">
          <span class="empty">Nothing saved.</span>
        </div>
        <div class="row">
          <button id="lab-export">Export</button>
          <button id="lab-import">Import</button>
        </div>
      </aside>
      <aside id="prog" hidden>
        <h1>Play</h1>
        <p class="hint">
          Place copies of the tile anywhere. The board fills in whatever every
          remaining tiling agrees on. Find them all.
        </p>
        <div class="row">
          <button id="prog-prev">◀ Prev</button>
          <button id="prog-next">Next ▶</button>
          <button id="prog-reset">Reset</button>
        </div>
        <div id="prog-level" class="prog-level"></div>
        <div id="prog-progress" class="hint"></div>
        <div class="row">
          <button id="prog-rotate">⟳ Rotate</button>
          <button id="prog-flip">⇄ Flip</button>
          <button id="prog-undo">Undo</button>
          <button id="prog-hint">Hint</button>
        </div>
        <div id="prog-message" class="prog-message"></div>
        <h2>Tilings</h2>
        <div id="prog-gallery" class="prog-gallery"></div>
      </aside>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
